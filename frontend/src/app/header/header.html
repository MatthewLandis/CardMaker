<nav class="navbar">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
    >Card Maker</a
  >
  <a routerLink="/cardCatalog" routerLinkActive="active">Card Catalog</a>
  <h1><span>Yu-Gi-Oh! </span>Card Maker</h1>
  <a style="color: brown" title="coming soon">Deck Editor</a>
  <a style="color: brown" title="coming soon">Deck Catalog</a>
  <div class="loginDisplay">
    @if (!authenticatedUser) {
      <button class="registerBtn" (click)="toggleForm('reg')">Register</button>
      <button class="loginBtn" (click)="toggleForm('log')">Login</button>
      @if (reg || log) {
        <form class="loginTemplate" (ngSubmit)="submit()">
          <h2>{{ log ? 'Sign in' : 'Register' }}</h2>
          <div class="loginInfo">
            <div class="inputs">
              <i class="bx bxs-user"></i>
              <input
                name="username"
                placeholder="Username"
                autocomplete="username"
                [(ngModel)]="username"
                spellcheck="false"
              />
            </div>
            <div class="inputs">
              <i class="bx bxs-lock"></i>
              <input
                name="password"
                type="password"
                placeholder="Password"
                [attr.autocomplete]="log ? 'current-password' : 'new-password'"
                [(ngModel)]="password"
              />
            </div>
          </div>
          @if (authError) {
            <p class="authError">{{ authError }}</p>
          }
          <button type="submit">{{ log ? 'Login' : 'Register' }}</button>
        </form>
      }
    } @else {
      <div class="log">{{ authenticatedUser }}</div>
      <button class="logoutBtn" (click)="logout()">Logout</button>
    }
  </div>
  <div class="home-links">
    <a href="https://www.linkedin.com/in/matthew-landis-885a02168/" title="Linkedin"
      ><i class="bx bxl-linkedin"></i
    ></a>
    <a href="https://github.com/MatthewLandis" title="GitHub"><i class="bx bxl-github"></i></a>
    <a href="mailto:Matthewlandis51@outlook.com" title="Mail"><i class="bx bx-envelope"></i></a>
  </div>
</nav>
